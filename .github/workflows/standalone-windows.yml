name: Build Windows standalone app

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "standalone/**"
      - ".github/workflows/standalone-windows.yml"

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: standalone
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: standalone/requirements.txt
      - run: pip install --disable-pip-version-check --no-index --find-links=wheels -r requirements-build.txt
      - run: pyinstaller --noconfirm --clean Pakistan_IDF_Atlas_Automator.spec
      - name: Verify packaged Selenium and Chrome WebDriver
        run: |
          .\dist\Pakistan_IDF_Atlas_Automator.exe --packaging-self-test packaging-smoke-test.json
          python -c "import json; p=json.load(open('packaging-smoke-test.json')); assert p['status']=='ok' and p['selenium_manager_exists']; print(p)"
      - uses: actions/upload-artifact@v4
        with:
          name: Pakistan-IDF-Atlas-Windows
          path: |
            standalone/dist/Pakistan_IDF_Atlas_Automator.exe
            standalone/README_STANDALONE.md
            standalone/packaging-smoke-test.json
